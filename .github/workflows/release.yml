name: Release

on:
  workflow_dispatch: # testing
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    name: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (aarch64-apple-darwin)
        run: cargo build --release --target aarch64-apple-darwin --locked

      - name: Package
        id: package
        run: |
          ARCHIVE="strudel-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"

          tar -czf "$ARCHIVE" -C target/aarch64-apple-darwin/release strudel

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      # see homebrew.yml for updating the Homebrew formula on draft publish.
      # tags with a "-" suffix (e.g. v1.2.4-beta.1) are marked pre-release,
      # which routes the formula update to strudel-beta instead of strudel.
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

      - name: Notify brrr
        env:
          BRRR_API_SECRET: ${{ secrets.BRRR_API_SECRET }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -X POST "https://api.brrr.now/v1/send" \
            -H "Authorization: Bearer $BRRR_API_SECRET" \
            -d "🚀 $REPO $TAG built"
