name: Homebrew

on:
  release:
    types: [published]

jobs:
  homebrew:
    name: update formula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update Homebrew formula
        env:
          HOMEBREW_PAT: ${{ secrets.HOMEBREW_PAT }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          ARCHIVE="strudel-${TAG}-aarch64-apple-darwin.tar.gz"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ARCHIVE}"

          # The asset is now public; fetch it and recompute the hash so the
          # formula's sha256 matches exactly what users will download.
          curl -sL --fail-with-body -o "$ARCHIVE" "$URL"
          SHA256=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')

          FORMULA=$(sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256__/${SHA256}/g" \
            -e "s/__ARCHIVE__/${ARCHIVE}/g" \
            .github/formula/strudel.rb)

          CURRENT_SHA=$(curl -sL \
            -H "Authorization: Bearer ${HOMEBREW_PAT}" \
            "https://api.github.com/repos/octavore/homebrew-tools/contents/Formula/strudel.rb" \
            | jq -r '.sha // empty')

          CONTENT_B64=$(printf '%s\n' "$FORMULA" | base64)

          jq -n \
            --arg message "strudel: update to v${VERSION}" \
            --arg content "$CONTENT_B64" \
            --arg sha "$CURRENT_SHA" \
            '{message: $message, content: $content, committer: {name: "github-actions[bot]", email: "github-actions[bot]@users.noreply.github.com"}} + (if $sha != "" then {sha: $sha} else {} end)' \
          | curl -sL --fail-with-body -X PUT \
            -H "Authorization: Bearer ${HOMEBREW_PAT}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/octavore/homebrew-tools/contents/Formula/strudel.rb" \
            --data-binary @-
