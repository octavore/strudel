project_name = "strudel-build"

[profiles.crates.env]
CARGO_REGISTRY_TOKEN = "axo://projects/crates-io/api-token"

[tasks]
build = "cargo build"
install = "cargo install --path ."
fmt = ["cargo clippy", "cargo +nightly fmt"]
check = "cargo +nightly fmt -- --check"
test = "cargo test --workspace --locked"
lint = "cargo clippy --workspace --all-targets --locked -- -D warnings"
"lint:md" = "rumdl check ."
ci = [":check", ":lint", ":lint:md", ":test"]
release = "./scripts/release.sh"

"example:hello-world" = "cargo run -- --config examples/HelloWorldApp/strudel.toml run"
"example:menu-bar" = "cargo run -- --config examples/MenuBarApp/strudel.toml run"
"example:multi-target" = "cargo run -- --config examples/MultiTargetApp/strudel.toml run"
"example:safari-extension" = "cargo run -- --config examples/SafariExtension/strudel.toml run"

"crates:publish:dry-run" = "cargo publish --workspace --locked --dry-run"
"crates:publish:appleid" = { command = "cargo publish --locked -p strudel-appleid", profile = "crates" }
"crates:publish:dmg" = { command = "cargo publish --locked -p strudel-dmg", profile = "crates" }
"crates:publish:icon" = { command = "cargo publish --locked -p strudel-icon", profile = "crates" }
"crates:publish:cli" = { command = "cargo publish --locked -p strudel-cli", profile = "crates" }

"crates:publish" = {
  command = [
    ":crates:publish:appleid",
    ":crates:publish:dmg",
    ":crates:publish:icon",
    ":crates:publish:cli",
  ],
}

[global_packages]
rust = "stable"
"rvben/rumdl" = "^0.2.52"
