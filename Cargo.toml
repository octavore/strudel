[package]
name = "strudel-cli"
version.workspace = true
edition = "2024"
description = "Build and ship macOS/iOS apps without touching Xcode"
readme = "README.md"
homepage = "https://github.com/octavore/strudel"
repository = "https://github.com/octavore/strudel"
license = "Apache-2.0"
keywords = ["codesign", "dmg", "macos", "notarize", "swift"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[workspace]
resolver = "2"
members = [".", "crates/appleid", "crates/dmg", "crates/icon"]

[workspace.package]
version = "0.5.0-beta.3"

[[bin]]
name = "strudel"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anyhow = "1"
appleid = {package = "strudel-appleid", path = "crates/appleid", version = "0.5.0-beta.3" }
base64 = "0.22"
clap = {version = "4", features = ["derive"]}
color-print = "0.3.7"
dmg = {package = "strudel-dmg", path = "crates/dmg", version = "0.5.0-beta.3" }
icon = {package = "strudel-icon", path = "crates/icon", version = "0.5.0-beta.3" }
image = {version = "0.25", default-features = false, features = ["png"]}
indoc = "2"
inquire = "0.9"
jsonwebtoken = {version = "10", features = ["rust_crypto"]}
plist = "1"
regex = "1.13.0"
secrecy = "0.10.3"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
shellexpand = "3"
srp = "=0.7.0-rc.3"
tempfile = "3"
toml = "1.1"
toml_edit = "0.25.12"
ureq = {version = "3", features = ["json"]}
xdg = "3.0.0"

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
